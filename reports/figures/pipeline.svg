<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 560' width='1080' height='560'>

<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7'
          markerHeight='7' orient='auto-start-reverse'>
    <path d='M 0 0 L 10 5 L 0 10 z' fill='#8fa3b8'/>
  </marker>
</defs>

<rect width='1080' height='560' fill='#ffffff'/>
<text x='24' y='34' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='700' fill='#1b2430'>Training pipeline — where the supervision comes from</text>
<rect x='24' y='70' width='210' height='66' rx='7' fill='#dceaf5' stroke='#2f6f9f' stroke-width='1.4'/><text x='129.0' y='98.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>train.txt</text><text x='129.0' y='115.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>225,300 words
zero overlap with test.txt</text>
<rect x='24' y='158' width='210' height='78' rx='7' fill='#dceaf5' stroke='#2f6f9f' stroke-width='1.4'/><text x='129.0' y='192.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>90 / 10 split by word</text><text x='129.0' y='209.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>fit 202,770
val 22,530 (disjoint)</text>
<line x1='129' y1='138' x2='129' y2='154' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='272' y='60' width='356' height='250' rx='9' fill='#eef3f8' stroke='#8fa3b8' stroke-width='1'/>
<text x='288' y='82' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#5b6b7c'>BAYES TEACHER  (label generator)</text>
<rect x='288' y='92' width='324' height='42' rx='7' fill='#ffffff' stroke='#8fa3b8' stroke-width='1.4'/><text x='450.0' y='108.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#1b2430'>Tier 1 — exact leave-one-out posterior</text><text x='450.0' y='125.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>positional + no surplus guessed letter</text>
<rect x='288' y='142' width='324' height='34' rx='7' fill='#ffffff' stroke='#8fa3b8' stroke-width='1.4'/><text x='450.0' y='164.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#1b2430'>Tier 2 — drop the present-letter rule</text>
<rect x='288' y='184' width='324' height='34' rx='7' fill='#ffffff' stroke='#8fa3b8' stroke-width='1.4'/><text x='450.0' y='206.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#1b2430'>Tier 3 — positional match only</text>
<rect x='288' y='226' width='324' height='44' rx='7' fill='#f7e7da' stroke='#b4622a' stroke-width='1.4'/><text x='450.0' y='243.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#1b2430'>Tier 4 — interpolated n-gram, noisy-OR</text><text x='450.0' y='260.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>covers the 45% with no candidates</text>
<text x='288' y='292' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='400' fill='#5b6b7c'>blended by candidate count, λ = n/(n+300)</text>
<line x1='240' y1='190' x2='284' y2='190' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='668' y='78' width='388' height='60' rx='7' fill='#dceaf5' stroke='#2f6f9f' stroke-width='1.4'/><text x='862.0' y='103.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Stage 0 — reachable-state warm start</text><text x='862.0' y='120.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>20 M states · ≤5 absent letters · frequency-weighted misses</text>
<rect x='668' y='152' width='388' height='60' rx='7' fill='#dceaf5' stroke='#2f6f9f' stroke-width='1.4'/><text x='862.0' y='177.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Stage 1 — DAgger self-play × 3</text><text x='862.0' y='194.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>roll out, label what the model visits, aggregate</text>
<rect x='668' y='226' width='388' height='60' rx='7' fill='#f7e7da' stroke='#b4622a' stroke-width='1.4'/><text x='862.0' y='251.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Stage 2/3 — Qwen3-4B teacher → distil</text><text x='862.0' y='268.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>selective: only where the oracle is blind</text>
<rect x='668' y='300' width='388' height='60' rx='7' fill='#dcefe6' stroke='#2f7d5d' stroke-width='1.4'/><text x='862.0' y='325.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Stage 4 — policy-gradient refinement</text><text x='862.0' y='342.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>reward = win − 0.001·wrong, KL trust region</text>
<rect x='668' y='374' width='388' height='60' rx='7' fill='#dcefe6' stroke='#2f7d5d' stroke-width='1.4'/><text x='862.0' y='399.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Stage 5 — calibrate + ensemble</text><text x='862.0' y='416.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>transformer + Bi-GRU + dilated CNN, logit-space</text>
<line x1='862' y1='138' x2='862' y2='150' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='862' y1='212' x2='862' y2='224' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='862' y1='286' x2='862' y2='298' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='862' y1='360' x2='862' y2='372' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='632' y1='130' x2='664' y2='108' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='24' y='374' width='596' height='60' rx='7' fill='#dcefe6' stroke='#2f7d5d' stroke-width='1.4'/><text x='322.0' y='399.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b2430'>Evaluation — play real games on the 22,530 held-out words</text><text x='322.0' y='416.0' text-anchor='middle' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5b6b7c'>strict rules · 6th wrong guess is a loss · ±0.32 pt standard error</text>
<line x1='320' y1='340' x2='320' y2='370' stroke='#8fa3b8' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='24' y='470' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#b4622a'>test.txt is used only to simulate games for the submission — never to train or tune anything.</text>
<text x='24' y='494' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#1b2430'>45.1% of on-policy states have no consistent training-dictionary word: lookup approaches hit a wall, a generalising model does not.</text>
<text x='24' y='518' text-anchor='start' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#5b6b7c'>Every state is stored as (word_id, guessed-letter bitmask) + soft target = 66 bytes; 20 M states fit in 1.3 GB.</text>
</svg>